name: AsLib

on:
  push:
    branches:
      - 'Release_*'
      - 'Dev_*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Determine Version from Branch Name
        run: |
          VERSION="${GITHUB_REF_NAME}-SNAPSHOT"
          echo "ASLIB_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Publishing version: ${VERSION}"

      - name: Build fabric
        run: ./gradlew build -Pdbuild.loader=fabric -Pmod_version=${{ env.ASLIB_VERSION }}

      - name: Build forge
        run: ./gradlew build -Pdbuild.loader=forge -Pmod_version=${{ env.ASLIB_VERSION }}

      - name: Collect fabric artifacts
        run: |
          mkdir -p build/repo/fabric
          find build/fabric/libs -type f -name '*.jar' -exec cp -v {} build/repo/fabric/ \;
          echo "--- fabric ---"
          ls -la build/repo/fabric/

      - name: Collect forge artifacts
        run: |
          mkdir -p build/repo/forge
          find build/forge/libs -type f -name '*.jar' -exec cp -v {} build/repo/forge/ \;
          echo "--- forge ---"
          ls -la build/repo/forge/

      - name: Deploy fabric to maven
        uses: jamesives/github-pages-deploy-action@v4
        with:
          folder: build/repo/fabric
          branch: maven
          target-folder: v/akfz/aslib-fabric/${{ env.ASLIB_VERSION }}
          clean: true

      - name: Deploy forge to maven
        uses: jamesives/github-pages-deploy-action@v4
        with:
          folder: build/repo/forge
          branch: maven
          target-folder: v/akfz/aslib-forge/${{ env.ASLIB_VERSION }}
          clean: true