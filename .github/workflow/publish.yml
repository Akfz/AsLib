name: AsLib

on:
  push:
    branches:
      - 'Release_*'
      - 'Dev_*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Determine Version from Branch Name
        id: set_version
        run: |
          VERSION="${GITHUB_REF_NAME}-SNAPSHOT"
          echo "ASLIB_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Publishing version: ${VERSION}"

      - name: Build fabric
        run: ./gradlew build -Pdbuild.loader=fabric -Pmod_version=${{ env.ASLIB_VERSION }}

      - name: Build forge
        run: ./gradlew build -Pdbuild.loader=forge -Pmod_version=${{ env.ASLIB_VERSION }}

      - name: Collect dev jars
        run: |
          mkdir -p build/repo
          find build/fabric/libs build/forge/libs \
            -type f -name '*-dev.jar' \
            -exec cp -v {} build/repo/ \; 2>/dev/null || true
          echo "--- build/repo ---"
          ls -la build/repo/

      - name: Deploy Maven to branch
        uses: jamesives/github-pages-deploy-action@v4
        with:
          folder: build/repo
          branch: maven
          clean: false