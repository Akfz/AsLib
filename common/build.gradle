plugins {
    id 'fabric-loom'
}

base {
    archivesName = "${project.archives_base_name}-common"
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

configurations {
    embed
    implementation.extendsFrom(embed)
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    compileOnly "org.spongepowered:mixin:${project.mixin_version}"
    compileOnly "org.ow2.asm:asm:9.5"
    compileOnly "org.ow2.asm:asm-tree:9.5"

    compileOnly "io.github.llamalad7:mixinextras-common:0.4.1"
    annotationProcessor "io.github.llamalad7:mixinextras-common:0.4.1"
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            version: project.mod_version,
            loader_version: project.fabric_loader_version,
            minecraft_version: project.minecraft_version,
            mod_id: project.mod_id,
            mod_name: project.mod_name,
            mod_description: project.mod_description,
            mod_authors: project.mod_authors,
            mod_license: project.mod_license,
            mod_icon: project.mod_icon
    ]
    inputs.properties replaceProperties

    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

def compileSharedCode = tasks.register('compileSharedCode', JavaCompile) {
    group = 'build'
    description = 'compile compileSharedCode to jar module common'

    dependsOn tasks.named('compileJava')

    source = fileTree(dir: 'src/sharedCode/java', include: '**/*.java')
    destinationDirectory = file("${project.layout.buildDirectory.get().asFile}/classes/java/sharedCode")
    classpath = sourceSets.main.compileClasspath + sourceSets.main.output

    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.named('jar', Jar) { Jar task ->
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    task.from sourceSets.main.output

    task.from(compileSharedCode) {
        include "**/*.class"
    }
}