plugins {
    id 'net.minecraftforge.gradle'
    id 'org.spongepowered.mixin'
}

base {
    archivesName = "${project.archives_base_name}-forge"
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}


minecraft {
    mappings channel: 'official', version: "${project.minecraft_version}"
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.earlydisplay.enable', 'false'

            mods {
                "aslib" {
                    source sourceSets.main
                    source project(':common').sourceSets.main
                }
            }
        }

        client {
            property 'mixin.config', 'aslib.mixins.json'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }

        server {
            property 'mixin.config', 'aslib.mixins.json'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', 'aslib', '--all', '--output', file('src/generated/resources/'), '--existing', project(':common').file('src/main/resources/')
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.forge_version}"
    annotationProcessor "org.spongepowered:mixin:${project.mixin_version}:processor"

    compileOnly "io.github.llamalad7:mixinextras-common:0.4.1"
    annotationProcessor "io.github.llamalad7:mixinextras-common:0.4.1"

    implementation project(path: ":common", configuration: "namedElements")
}

mixin {
    add sourceSets.main, "aslib.refmap.json"
    config "aslib.mixins.json"
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
            //srcDirs += project(':common').file("src/main/java")
            srcDirs += project(':common').file("src/sharedMixins/java")
            srcDirs += project(':common').file("src/generated/java")
        }
        resources {
            srcDirs = ['src/main/resources']
            srcDirs += project(':common').file("src/main/resources")
            srcDirs += project(':common').file("src/generated/resources")
        }
    }
}

tasks.named('jar', Jar).configure {
    from sourceSets.main.output

    manifest {
        attributes([
                "Specification-Title"     : 'aslib',
                "Specification-Vendor"    : 'n.paradox',
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.mod_version,
                "Implementation-Vendor"   : 'n.paradox',
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}