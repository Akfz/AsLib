plugins {
    id 'net.minecraftforge.gradle'
    id 'org.spongepowered.mixin'
}

base {
    archivesName = "${project.archives_base_name}-forge"
}

minecraft {
    mappings channel: 'official', version: "${project.minecraft_version}"
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "aslib" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'mixin.config', 'aslib.mixins.json'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }

        server {
            property 'mixin.config', 'aslib.mixins.json'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', 'aslib', '--all', '--output', file('src/generated/resources/'), '--existing', project(':common').file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    minecraft "net.minecraftforge:forge:${project.forge_version}"

    annotationProcessor "org.spongepowered:mixin:${project.mixin_version}:processor"
}

mixin {
    config "aslib.mixins.json"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            mc_version: project.minecraft_version,
            mod_id: 'aslib',
            mod_name: 'ASLib',
            mod_version: project.mod_version,
            mod_authors: 'n.paradox',
            mod_description: 'Library for structural resource packs'
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : 'aslib',
                'Specification-Vendor'    : 'n.paradox',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : 'n.paradox',
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}